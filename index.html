<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,800;1,900&display=swap" rel="stylesheet">
    
    <style>
        :root { --orange: #FF6B00; --bg: #050505; --card: #111111; }
        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif;
            user-select: none; -webkit-user-select: none;
            padding-bottom: 95px; /* Увеличили отступ под ТабБар */
        }
        
        /* Стили карточек как у SUN */
        .sun-card { 
            background: var(--card); 
            border-radius: 24px; 
            padding: 16px;
            display: flex; flex-direction: column; justify-content: space-between;
            height: 160px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.1s;
        }
        .sun-card:active { transform: scale(0.96); }
        
        /* Иконки с 3D свечением внутри карточек */
        .img-container {
            width: 60px; height: 60px; margin: 0 auto;
            background: #000; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 25px rgba(255, 107, 0, 0.3);
            border: 1px solid rgba(255, 107, 0, 0.2);
            font-size: 28px;
        }

        /* Строка поиска */
        .search-bar {
            background: #1C1C1E; border-radius: 16px; padding: 14px 20px;
            display: flex; align-items: center; gap: 10px;
            color: #8E8E93; font-size: 14px; font-weight: 700;
        }

        /* Нижнее меню (ХИРУРГИЧЕСКИ ИЗМЕНЕНО НА 4 ПУНКТА) */
        .tabbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
            background: rgba(14, 14, 16, 0.98); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: 20px; z-index: 1000;
        }
        .tab-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: #666; font-size: 10px; font-weight: 800; text-transform: uppercase;
            transition: color 0.1s;
        }
        .tab-item.active { color: var(--orange); }
        /* Минималистичные outline-иконки, как у друга */
        .tab-item svg { width: 22px; height: 22px; stroke-width: 2; }
        
        ::-webkit-scrollbar { display: none; }
        
        /* Класс для скрытия экранов в SPA */
        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="max-w-md mx-auto p-4 relative">

    <div class="p-4 flex items-center justify-between sticky top-0 bg-[#050505] z-50">
        <div class="flex items-center gap-3">
            <div id="user-avatar" class="w-10 h-10 rounded-full border border-gray-800 flex items-center justify-center bg-gray-900 overflow-hidden">
                <span class="text-xs font-bold text-gray-500">V</span>
            </div>
            <div>
                <h1 id="user-name" class="text-xs font-black tracking-wide uppercase italic">Загрузка...</h1>
                <div class="text-[9px] text-[#FF6B00] font-bold uppercase tracking-wider mt-0.5">Vibe Resident</div>
            </div>
        </div>
        <div class="text-sm font-black tracking-tighter italic uppercase">VIBE<span class="text-[#FF6B00]">.</span></div>
    </div>


    <div id="home-screen" class="px-2">
        <div class="search-bar mb-6">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="w-5 h-5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <span>Поиск по базе знаний...</span>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="sun-card" onclick="tg.showAlert('Раздел Эфиры')">
                <div class="img-container">🎙️</div>
                <div class="text-xl font-black italic uppercase">Эфиры</div>
            </div>
            <div class="sun-card" onclick="tg.showAlert('Раздел Курсы')">
                <div class="img-container">🧠</div>
                <div class="text-xl font-black italic uppercase">Курсы</div>
            </div>
            <div class="sun-card" onclick="tg.showAlert('Раздел Проекты')">
                <div class="img-container">💼</div>
                <div class="text-xl font-black italic uppercase">Проекты</div>
            </div>
            <div class="sun-card" onclick="tg.showAlert('Раздел Книги')">
                <div class="img-container">📖</div>
                <div class="text-xl font-black italic uppercase">Книги</div>
            </div>
        </div>
    </div>


    <div id="club-screen" class="hidden-screen p-4 text-center">Раздел Клуб (скоро)</div>
    <div id="chat-screen" class="hidden-screen p-4 text-center">Раздел Чаты (скоро)</div>
    <div id="profile-screen" class="hidden-screen p-4 text-center">Раздел Профиль (скоро)</div>


    <div class="tabbar">
        <div class="tab-item active" onclick="switchTab('home-screen', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span>Домой</span>
        </div>
        <div class="tab-item" onclick="switchTab('club-screen', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <span>Клуб</span>
        </div>
        <div class="tab-item" onclick="switchTab('chat-screen', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            <span>Чаты</span>
        </div>
        <div class="tab-item" onclick="switchTab('profile-screen', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span>Профиль</span>
        </div>
    </div>


    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505');

        // Подгружаем данные юзера
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name;
            // Ставим первую букву имени в аватар
            document.getElementById('user-avatar').innerHTML = `<span class="text-sm font-bold text-gray-400">${user.first_name.charAt(0)}</span>`;
        } else {
            document.getElementById('user-name').innerText = "Гость";
        }

        // --- ЛОГИКА ТАББАРА v3.1 (SPA switcher) ---
        function switchTab(screenId, tabElement) {
            // 1. Скрываем вообще все экраны, которые у нас есть в SPA
            const screens = ['home-screen', 'club-screen', 'chat-screen', 'profile-screen'];
            screens.forEach(id => {
                const screen = document.getElementById(id);
                if (screen) screen.classList.add('hidden-screen');
            });

            // 2. Показываем нужный экран
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) targetScreen.classList.remove('hidden-screen');

            // 3. Переключаем активный статус иконкам в ТабБаре
            const tabs = document.querySelectorAll('.tab-item');
            tabs.forEach(tab => tab.classList.remove('active'));
            tabElement.classList.add('active');

            // 4. Управляем кнопкой Назад (убираем её, так как навигация через ТабБар)
            tg.BackButton.hide();
        }
    }
    </script>
</body>
</html>
